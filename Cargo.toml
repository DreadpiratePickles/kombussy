[workspace]
members = ["crates/kombussy-core", "crates/kombussy-cli", "crates/kombussy-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/DreadpiratePickles/kombussy"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
